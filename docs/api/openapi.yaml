        '200': { description: Barcode added }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants/{tenant}/products/{product}/barcodes/{barcode}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: product, in: path, required: true, schema: { type: string } }
      - { name: barcode, in: path, required: true, schema: { type: string } }
    delete:
      summary: Remove a barcode
      responses:
        '200': { description: Barcode removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/product-categories:
