          application/json:
            schema:
              type: object
              required: [payment_id, amount, reason]
              properties:
                payment_id: { type: string, description: Payment ULID }
                amount: { type: number, exclusiveMinimum: 0 }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201': { description: Refund recorded as requested (no ledger impact until completed) }
