  /platform/marketing/integrations/google:
    get:
      tags: [Marketing Integrations]
      summary: 'GET /platform/marketing/integrations/google'
      description: Google connection status, configured scopes, synced record counts, recent sync runs and logs. Reports reviews as unsupported instead of inventing metrics.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { description: Authentication required }
        '403': { description: Not permitted }
    delete:
      tags: [Marketing Integrations]
      summary: 'DELETE /platform/marketing/integrations/google'
      description: Revokes the Google token, deletes synced Google records and marks the connection revoked.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Disconnected }
        '401': { description: Authentication required }
        '403': { description: Not permitted }
  /platform/marketing/integrations/google/connect:
    get:
      tags: [Marketing Integrations]
      summary: 'GET /platform/marketing/integrations/google/connect'
      description: Builds the Google OAuth 2.0 authorization URL with PKCE. Returns 422 GOOGLE_NOT_CONFIGURED until owner client credentials are set.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Authorization URL issued }
        '401': { description: Authentication required }
        '403': { description: Not permitted }
        '422': { description: Google client credentials not configured }
  /platform/marketing/integrations/google/callback:
    get:
      tags: [Marketing Integrations]
      summary: 'GET /platform/marketing/integrations/google/callback'
      description: OAuth callback. Consumes the single-use state, exchanges the authorization code and redirects the app to the Google integrations page with a connected or error flag. Throttled.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302': { description: Redirect to the app integrations page }
        '429': { description: Rate limited }
  /platform/marketing/integrations/google/sync:
    post:
      tags: [Marketing Integrations]
      summary: 'POST /platform/marketing/integrations/google/sync'
      description: Queues a Google sync run for search_console, ga4, business, gtm or all. Queued runs execute in the background.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [search_console, ga4, business, gtm, all] }
      responses:
        '202': { description: Sync runs queued }
        '401': { description: Authentication required }
        '403': { description: Not permitted }
        '409': { description: Google account not connected }
        '422': { description: Validation failed }
