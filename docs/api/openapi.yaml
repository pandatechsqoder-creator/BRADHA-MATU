                compensation_amount: { type: number, minimum: 0 }
                expires_in_hours: { type: integer, minimum: 1, maximum: 168 }
                override_reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201': { description: Offer created; job advances to awaiting worker acceptance }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/assignments/{assignment}/reassign:
    post:
      summary: Replace a worker on an assignment (stocktake.job.assign)
      parameters:
        - { name: assignment, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id, reason]
              properties:
                profile_id: { type: string }
                role: { type: string, enum: [lead, counter, supervisor] }
                compensation_amount: { type: number, minimum: 0 }
                expires_in_hours: { type: integer, minimum: 1, maximum: 168 }
                reason: { type: string, minLength: 3, maxLength: 500 }
                override_reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: Replacement offered; prior assignment reassigned and its earning reversed }
