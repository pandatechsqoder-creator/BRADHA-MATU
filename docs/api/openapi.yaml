        - { name: search, in: query, schema: { type: string } }
        - { name: stock_location, in: query, schema: { type: string } }
        - { name: in_stock, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Paginated balances; value is null without cost permission }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/inventory/batches:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      summary: Batch and expiry register with aggregated quantity and days to expiry
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: expiry, in: query, schema: { type: string, enum: [soon, expired] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Paginated batches }
  /tenants/{tenant}/inventory/serials:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      summary: Serial register with status and location filters
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [in_stock, sold, returned, scrapped, missing] } }
        - { name: stock_location, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Paginated serials }
  /tenants/{tenant}/inventory/movements:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      summary: Movement ledger with type, source, location, text and date filters
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: stock_location, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Paginated movements with lines }
    post:
      summary: Post a movement with one or more lines (inventory.movement.create; adjustment needs inventory.adjust)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_location_id, type, lines]
              properties:
                stock_location_id: { type: string }
                type:
                  type: string
                  enum: [opening, purchase, sale, return, transfer_in, transfer_out, adjustment, production, damage, expiry, consumption, other]
                reference: { type: string, nullable: true }
                occurred_at: { type: string, format: date-time, nullable: true }
                notes: { type: string, nullable: true }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, quantity]
                    properties:
                      sku: { type: string }
                      quantity: { type: number }
                      batch_number: { type: string, nullable: true }
                      serial_number: { type: string, nullable: true }
                      expires_on: { type: string, format: date, nullable: true }
                      unit_cost: { type: number, nullable: true }
      responses:
        '201': { description: Movement posted; balances and tracking registers updated }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/inventory/movements/import:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    post:
      summary: Import external movements from CSV/XLSX (grouped by External ID, idempotent)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                source: { type: string, enum: [import, external] }
      responses:
        '201': { description: Import result with created/skipped counts, row errors and sample movements }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /tenants/{tenant}/inventory/movements/{movement}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: movement, in: path, required: true, schema: { type: string } }
    get:
      summary: Movement detail with lines and linked cut-off
      responses:
        '200': { description: Movement }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/inventory/cutoffs:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      summary: List cut-offs with movement counts
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, closed] } }
      responses:
        '200': { description: Cut-offs }
    post:
      summary: Open a cut-off for a location or branch (inventory.snapshot.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stock_location_id: { type: string, nullable: true }
                branch_id: { type: string, nullable: true }
                cut_off_at: { type: string, format: date-time, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        '201': { description: Cut-off opened; later movements are linked automatically }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants/{tenant}/inventory/cutoffs/{cutoff}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: cutoff, in: path, required: true, schema: { type: string } }
    get:
      summary: Cut-off detail with linked movements and snapshots
      responses:
        '200': { description: Cut-off }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/inventory/cutoffs/{cutoff}/close:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: cutoff, in: path, required: true, schema: { type: string } }
    post:
      summary: Close a cut-off (links remaining movements and records audit)
      responses:
        '200': { description: Cut-off closed }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants/{tenant}/inventory/snapshots:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      summary: List frozen snapshots
      responses:
        '200': { description: Snapshots }
    post:
      summary: Freeze expected stock for a cut-off or scope (inventory.snapshot.create)
      description: Repeating the same scope, catalogue version and cut-off returns the existing snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cutoff_id: { type: string, nullable: true }
                stock_location_id: { type: string, nullable: true }
                branch_id: { type: string, nullable: true }
                snapshot_at: { type: string, format: date-time, nullable: true }
                job_id: { type: string, nullable: true }
                reference: { type: string, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        '201': { description: Snapshot frozen with checksum and items }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants/{tenant}/inventory/snapshots/{snapshot}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: snapshot, in: path, required: true, schema: { type: string } }
    get:
      summary: Snapshot detail with items (costs only with catalogue.update)
      responses:
        '200': { description: Snapshot }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/inventory/snapshots/{snapshot}/items:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: snapshot, in: path, required: true, schema: { type: string } }
    get:
      summary: Paginated snapshot items with search
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Paginated snapshot items; cost fields are null without permission }
  /catalogue-pricing/estimate:
    get:
      summary: Estimate the catalogue fee for a product count using the active policy
      parameters:
        - { name: product_count, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Estimate with subtotal, tax, total and explanation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: object }
  /platform/catalogue-pricing:
    get:
      summary: Active catalogue pricing policy with sample estimates and full version history (pricing.manage)
      responses:
        '200': { description: Policy, estimates and versions }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Update the pricing policy (creates a new immutable pricing version)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                pricing_model: { type: string, enum: [banded, flat, per_product, minimum, capped, promotional, negotiated] }
                currency: { type: string }
                product_count_basis: { type: string, enum: [active_variants, active_products, sellable_skus] }
                base_charge: { type: number }
                included_products: { type: integer }
                scale_products: { type: integer }
                max_charge: { type: number }
                tax_rate: { type: number }
                notes: { type: string, nullable: true }
      responses:
        '200': { description: Policy updated and a new pricing version created }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/stocktake-jobs:
    get:
      summary: List stock-taking requests with status counts and buckets (tenant)
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string, enum: [low, normal, high, critical] } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Paginated request summaries with meta.status_counts and meta.buckets (drafts, awaiting_deposit, with_platform, active, closed) }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a stock-taking request (draft)
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StocktakeJobInput' }
      responses:
        '201': { description: Request created with provisional estimate and deposit }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/stocktake-jobs/estimate:
    post:
      summary: Calculate a provisional estimate and deposit for a scope
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StocktakeScopeInput' }
      responses:
        '200': { description: Estimate lines, tax, total, deposit and catalogue readiness }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/stocktake-jobs/{job}:
    get:
      summary: Tenant view of a request, quote, deposit, amendments and timeline
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Tenant payload (internal economics always null) }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a draft or a request awaiting tenant information
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: job, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StocktakeJobInput' }
      responses:
        '200': { description: Request updated }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/stocktake-jobs/{job}/submit:
    post:
      summary: Submit a request with a request-specific scope declaration
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: job, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_declaration]
              properties:
                request_declaration:
                  type: object
                  required: [confirm_accuracy]
                  properties:
                    confirm_accuracy: { type: boolean, enum: [true] }
                    exceptions: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200': { description: Request submitted; includes its immutable request declaration revision }
        '422': { description: Catalogue, declaration, or request status validation failed }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/stocktake-jobs/{job}/deposits:
    post:
      summary: Record a deposit payment pending platform verification
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: job, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method]
              properties:
                amount: { type: number, minimum: 0 }
                method: { type: string, enum: [mpesa, card, bank, manual] }
                reference: { type: string, maxLength: 120 }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: Payment recorded with status pending }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants/{tenant}/stocktake-jobs/{job}/quote/accept:
    post:
      summary: Accept the issued quote (requires a confirmed deposit)
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Quote accepted; request moves to awaiting_balance_payment }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: No payable quote or deposit outstanding }
  /tenants/{tenant}/stocktake-jobs/{job}/quote/decline:
    post:
      summary: Decline the issued quote and return the request to review
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: job, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200': { description: Quote declined }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/stocktake-jobs/{job}/cancel:
    post:
      summary: Cancel a request and record any cancellation fee and refund
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: job, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200': { description: Request cancelled with cancellation summary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Request can no longer be cancelled }
  /tenants/{tenant}/stocktake-jobs/{job}/amendments:
    post:
      summary: Request an amendment to a submitted request
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
        - { name: job, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes: { type: object, additionalProperties: true }
                reason: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Amendment recorded as pending }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/stocktake-jobs:
    get:
      summary: Platform queue of submitted stock-taking requests (drafts excluded)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string, enum: [low, normal, high, critical] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Paginated requests with meta.buckets (new_requests, awaiting_deposit, under_review, quotes_pending, ready_to_execute, active_jobs) }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/stocktake-jobs/{job}:
    get:
      summary: Platform view including confidential internal economics
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Platform payload with internal budget, fee, margin and notes }
        '404': { description: Job not found, or still a tenant draft }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/stocktake-jobs/{job}/review:
    post:
      summary: Move a submitted request into review (stocktake.job.review)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Request under review }
        '422': { description: Invalid transition }
  /platform/stocktake-jobs/{job}/request-information:
    post:
      summary: Ask the tenant for clarification (stocktake.job.review)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200': { description: Request moved to needs_tenant_information }
  /platform/stocktake-jobs/{job}/quotes:
    post:
      summary: Issue a quote with tenant charges and separate worker compensation (stocktake.quote.issue)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_service_charge]
              properties:
                base_service_charge: { type: number, minimum: 0 }
                scope_complexity_charge: { type: number, minimum: 0 }
                travel_expenses: { type: number, minimum: 0 }
                other_expenses: { type: number, minimum: 0 }
                discount: { type: number, minimum: 0 }
                tax_rate: { type: number, minimum: 0, maximum: 100 }
                deposit_type: { type: string, enum: [none, fixed, percentage] }
                deposit_value: { type: number, minimum: 0 }
                deposit_amount: { type: number, minimum: 0 }
                worker_compensation_budget: { type: number, minimum: 0 }
                worker_compensation_breakdown: { type: array, items: { type: object, additionalProperties: true } }
                platform_fee: { type: number, minimum: 0 }
                notes: { type: string, maxLength: 2000 }
                internal_notes: { type: string, maxLength: 2000 }
                valid_until: { type: string, format: date }
      responses:
        '201': { description: Quote issued; request awaiting acceptance }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/stocktake-jobs/{job}/deposits/{payment}/verify:
    post:
      summary: Confirm or fail a deposit payment (finance.payment.record)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
        - { name: payment, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [confirm, fail] }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Payment verified and request advanced or returned }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/stocktake-jobs/{job}/deposit/waive:
    post:
      summary: Waive the deposit requirement (finance.payment.record)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200': { description: Deposit waived and request submitted }
  /platform/stocktake-jobs/{job}/amendments/{amendment}/decision:
    post:
      summary: Approve or reject a tenant amendment (stocktake.job.review)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
        - { name: amendment, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, maxLength: 1000 }
                financial_impact: { type: number }
      responses:
        '200': { description: Amendment decided; approved changes supersede quotes }
  /workforce/profile:
    get:
      summary: Worker's own stock-taker profile (workforce.profile.view)
      responses:
        '200':
          description: Profile or null when onboarding has not started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          profile: { allOf: [{ $ref: '#/components/schemas/WorkforceProfile' }, { nullable: true }] }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create or refresh the worker's own profile (workforce.profile.view)
      description: Restricted fields (level, verification_status, training_completed_at) are ignored from this payload.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkforceProfileInput' }
      responses:
        '201': { description: Profile created }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    patch:
      summary: Update editable profile details (workforce.profile.view)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkforceProfileInput' }
      responses:
        '200': { description: Profile updated }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /workforce/profile/skills:
    put:
      summary: Replace the worker's skills (workforce.profile.view)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skills]
              properties:
                skills:
                  type: array
                  items:
                    type: object
                    required: [skill]
                    properties:
                      skill: { type: string, maxLength: 80 }
                      level: { type: string, enum: [basic, intermediate, advanced] }
                      years_experience: { type: integer, minimum: 0, maximum: 60 }
      responses:
        '200': { description: Skills replaced and audited }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /workforce/profile/service-areas:
    put:
      summary: Replace the worker's service areas (workforce.profile.view)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areas]
              properties:
                areas:
                  type: array
                  items:
                    type: object
                    required: [area]
                    properties:
                      area: { type: string, maxLength: 120 }
                      city: { type: string, maxLength: 120 }
                      county: { type: string, maxLength: 120 }
                      is_primary: { type: boolean }
      responses:
        '200': { description: Service areas replaced and audited }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /workforce/profile/availability:
    put:
      summary: Replace the worker's weekly availability windows (workforce.profile.view)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [windows]
              properties:
                windows:
                  type: array
                  items:
                    type: object
