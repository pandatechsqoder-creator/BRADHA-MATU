        '200': { description: Team slots, proposed compensation, recommendations and active assignments }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Job not found }
  /platform/stocktake-jobs/{job}/assignments:
    get:
      summary: Active and historical assignments for a job (stocktake.job.assign|assignment.view)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Assignment rows with internal metadata for platform staff }
    post:
      summary: Offer an assignment to a stock taker (stocktake.job.assign)
      description: Ineligible workers require an override reason; team capacity and duplicate active offers are enforced server-side.
      parameters:
        - { name: job, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
