      tags: [Marketing Automation]
      summary: 'POST /platform/marketing/workflows'
      description: Create a draft workflow with lead triggers, optional conditions and ordered steps.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger, steps]
              properties:
                name: { type: string, maxLength: 190 }
                description: { type: string, maxLength: 2000 }
                trigger: { type: string, enum: [lead.created, lead.assigned, lead.status_changed] }
                conditions:
                  type: object
                  properties:
                    lead_type: { type: array, items: { type: string } }
                    source: { type: string }
                    utm_campaign: { type: string }
                steps:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [type]
                    properties:
                      type: { type: string, enum: [notify_internal, notify_external, add_activity, wait] }
                      config: { type: object }
      responses:
        '201': { description: Created }
        '422': { description: Validation failed }
        '401': { description: Authentication required }
        '403': { description: Not permitted }
