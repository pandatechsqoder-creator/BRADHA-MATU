      parameters:
        - { name: assignment, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Offer declined }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /workforce/earnings:
