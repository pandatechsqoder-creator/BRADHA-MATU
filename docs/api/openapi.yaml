      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, process, fail, cancel] }
                reference: { type: string, maxLength: 120 }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Refund transitioned; processing success posts the balanced refund journal }
        '422': { description: Invalid transition for the current refund status }
