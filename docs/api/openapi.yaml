      responses:
        '200': { description: Assignment rows }
        '404': { description: Worker has not created a profile }
  /workforce/assignments/{assignment}:
    get:
      summary: Worker's own assignment detail (assignment.view)
      parameters:
        - { name: assignment, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Assignment detail }
        '404': { description: Not found or not owned by the caller }
  /workforce/assignments/{assignment}/accept:
    post:
      summary: Accept an open offer (assignment.accept)
      description: Rechecks offer ownership, expiry, job state and team capacity; accrues the disclosed earning and advances the job to scheduled when the team is complete.
      parameters:
        - { name: assignment, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Assignment accepted }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /workforce/assignments/{assignment}/decline:
    post:
