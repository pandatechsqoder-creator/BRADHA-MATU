        '403': { description: Not permitted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token. Expiry via SANCTUM_TOKEN_EXPIRATION (minutes).
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          type: object
          properties:
            request_id: { type: string }
            timestamp: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            request_id: { type: string }
    User:
      type: object
      required: [id, name, email, email_verified_at, created_at]
      properties:
        id: { type: string, description: ULID public identifier }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { type: string }
        tenants:
          type: array
          items: { $ref: '#/components/schemas/TenantSummary' }
        current_tenant:
          allOf:
            - $ref: '#/components/schemas/TenantSummary'
          nullable: true
    Role:
      type: object
      required: [slug, name, scope]
      properties:
        slug: { type: string }
        name: { type: string }
        scope: { type: string, enum: [platform, tenant, workforce] }
        tenant_id: { type: string, nullable: true }
    TenantSummary:
      type: object
      required: [id, name, status, operating_mode]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [pending, active, suspended] }
        operating_mode: { type: string, enum: [brathamatu_pos, external, manual] }
        industry: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string }
        members_count: { type: integer }
        branches_count: { type: integer }
    Tenant:
      allOf:
        - $ref: '#/components/schemas/TenantSummary'
        - type: object
          properties:
            legal_name: { type: string, nullable: true }
            email: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            address: { type: string, nullable: true }
            business_type: { type: string, nullable: true }
            timezone: { type: string }
            created_at: { type: string, format: date-time }
    TenantInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        legal_name: { type: string, nullable: true, maxLength: 200 }
        industry: { type: string, nullable: true, maxLength: 120 }
        business_type: { type: string, nullable: true, maxLength: 120 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true, maxLength: 40 }
        address: { type: string, nullable: true, maxLength: 255 }
        timezone: { type: string, example: Africa/Nairobi }
        operating_mode: { type: string, enum: [brathamatu_pos, external, manual] }
        status: { type: string, enum: [pending, active, suspended] }
    Dashboard:
      type: object
      required: [workspace, roles]
      properties:
        workspace: { type: string, enum: [platform, tenant, workforce, onboarding] }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        tenant:
          allOf:
            - $ref: '#/components/schemas/TenantSummary'
          nullable: true
        stats:
          type: object
          additionalProperties: true
        onboarding:
          type: object
          additionalProperties: { type: boolean }
    PlatformOverview:
      type: object
      properties:
        tenants:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
            pending: { type: integer }
            suspended: { type: integer }
        users:
          type: object
          properties:
            total: { type: integer }
            verified: { type: integer }
        memberships:
          type: object
          properties:
            active: { type: integer }
        audit_events_7d: { type: integer }
    Member:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        status: { type: string }
        joined_at: { type: string, format: date-time, nullable: true }
        roles:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
        branch_scopes:
          type: array
          description: Empty means access to every branch in the tenant.
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
    AuditLog:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        actor: { type: string, nullable: true }
        tenant_id: { type: integer, nullable: true }
        tenant: { type: string, nullable: true }
        subject_type: { type: string, nullable: true }
        subject_id: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    TenantRole:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
    Branch:
      type: object
      properties:
        id: { type: string, description: ULID }
        name: { type: string }
        code: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        timezone: { type: string }
        status: { type: string, enum: [active, inactive] }
        departments_count: { type: integer }
        warehouses_count: { type: integer }
        locations_count: { type: integer }
        created_at: { type: string, format: date-time, nullable: true }
    BranchInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        code: { type: string, maxLength: 40, nullable: true, description: Unique per tenant }
        address: { type: string, maxLength: 255, nullable: true }
        city: { type: string, maxLength: 120, nullable: true }
        phone: { type: string, maxLength: 40, nullable: true }
        email: { type: string, format: email, nullable: true }
        timezone: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
    StockZone:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string, nullable: true }
        bins_count: { type: integer }
    StockBin:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string, nullable: true }
    Invitation:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, nullable: true }
        role_name: { type: string, nullable: true }
        branch_id: { type: string, nullable: true }
        branch_name: { type: string, nullable: true }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expires_at: { type: string, format: date-time, nullable: true }
        accepted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
    InvitationPreview:
      type: object
      properties:
        invitation_id: { type: string }
        organisation: { type: string, nullable: true }
        email: { type: string }
        role: { type: string, nullable: true }
        branch: { type: string, nullable: true }
        status: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
    AuthPayload:
      type: object
      required: [user, token]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
    RegisterInput:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, description: Must contain letters and numbers }
        password_confirmation: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device_name: { type: string, maxLength: 120, default: web }
    Health:
      type: object
      required: [status, service, version, time, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        version: { type: string }
        time: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }
    StocktakeScopeInput:
      type: object
      properties:
        job_type: { type: string, enum: [full, cycle, spot, recurring, on_demand] }
        priority: { type: string, enum: [low, normal, high, critical] }
        count_method: { type: string, enum: [quantity, barcode, guided, blind, manual, hybrid] }
        required_team_size: { type: integer, minimum: 1, maximum: 500 }
        product_scope: { type: string, enum: [all, category, variant] }
        product_scope_payload: { type: array, items: { type: string } }
        branch_ids: { type: array, items: { type: string } }
        stock_location_ids: { type: array, items: { type: string } }
    StocktakeJobInput:
      allOf:
        - $ref: '#/components/schemas/StocktakeScopeInput'
        - type: object
          required: [title]
          properties:
            title: { type: string, minLength: 3, maxLength: 200 }
            description: { type: string, maxLength: 2000, nullable: true }
            preferred_start_at: { type: string, format: date-time, nullable: true }
            deadline_at: { type: string, format: date-time, nullable: true }
            safety_requirements: { type: string, nullable: true }
            access_requirements: { type: string, nullable: true }
            stock_movement_cutoff: { type: string, nullable: true }
            required_skills: { type: array, items: { type: string } }
            required_qualifications: { type: string, nullable: true }
            required_evidence: { type: array, items: { type: string } }
            custom_instructions: { type: string, nullable: true }
    StocktakePolicy:
      type: object
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        base_charge: { type: number, minimum: 0 }
        per_sku_charge: { type: number, minimum: 0 }
        per_location_charge: { type: number, minimum: 0 }
        per_branch_charge: { type: number, minimum: 0 }
        priority_multipliers:
          type: object
          properties:
            low: { type: number }
            normal: { type: number }
            high: { type: number }
            critical: { type: number }
        tax_rate: { type: number, minimum: 0, maximum: 100 }
        deposit_type: { type: string, enum: [none, fixed, percentage] }
        deposit_value: { type: number, minimum: 0 }
        deposit_minimum: { type: number, minimum: 0 }
        deposit_maximum: { type: number, minimum: 0 }
        deposit_due_days: { type: integer, minimum: 0, maximum: 60 }
        balance_due_days: { type: integer, minimum: 0, maximum: 90 }
        cancellation_fee_percent: { type: number, minimum: 0, maximum: 100 }
        deposit_policy_overrides: { type: object, additionalProperties: true }
    WorkforceProfileInput:
      type: object
      required: [legal_name]
      properties:
        legal_name: { type: string, maxLength: 160 }
        phone: { type: string, maxLength: 30 }
        city: { type: string, maxLength: 120 }
        county: { type: string, maxLength: 120 }
        country: { type: string, maxLength: 80 }
        languages:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 40 }
        transport: { type: string, maxLength: 120 }
        experience_years: { type: integer, minimum: 0, maximum: 60 }
        bio: { type: string, maxLength: 2000 }
        terms_accepted: { type: boolean }
    WorkforceProfile:
      type: object
      properties:
        id: { type: string }
        user:
          type: object
          properties:
            id: { type: string, nullable: true }
            name: { type: string, nullable: true }
            email: { type: string, nullable: true }
        legal_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        city: { type: string, nullable: true }
        county: { type: string, nullable: true }
        level: { type: string, enum: [applicant, trainee, verified, professional, expert, senior_supervisor] }
        level_label: { type: string }
        status: { type: string, enum: [active, suspended, inactive] }
        verification_status: { type: string, enum: [unverified, pending, verified, rejected] }
        training_completed: { type: boolean }
        terms_accepted_at: { type: string, format: date-time, nullable: true }
        training_completed_at: { type: string, format: date-time, nullable: true }
        completed_jobs_count: { type: integer }
        verified_accuracy: { type: number, nullable: true }
        skills:
          type: array
          items:
            type: object
            properties:
              id: { type: string, nullable: true }
              skill: { type: string }
              level: { type: string, nullable: true }
              years_experience: { type: integer, nullable: true }
              verified: { type: boolean }
        service_areas:
          type: array
          items:
            type: object
            properties:
              area: { type: string }
              city: { type: string, nullable: true }
              county: { type: string, nullable: true }
              is_primary: { type: boolean }
        availability:
          type: array
          items:
            type: object
            properties:
              weekday: { type: integer }
              weekday_label: { type: string }
              start_time: { type: string }
              end_time: { type: string }
              timezone: { type: string }
              active: { type: boolean }
        trainings:
          type: array
          items:
            type: object
            properties:
              module: { type: string }
              status: { type: string }
              score: { type: number, nullable: true }
              completed_at: { type: string, format: date-time, nullable: true }
        verification_checks:
          type: array
          items:
            type: object
            properties:
              check_type: { type: string }
              status: { type: string }
              verified_at: { type: string, format: date-time, nullable: true }
              reference: { type: string, nullable: true }
              notes: { type: string, nullable: true }
        stats:
          type: object
          properties:
            active_assignments: { type: integer }
            completed_assignments: { type: integer }
            earnings:
              type: object
              additionalProperties: { type: number }
  responses:
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Caller lacks the required role or permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found or not visible to the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }