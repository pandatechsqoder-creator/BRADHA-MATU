    post:
      summary: Reconcile a provider statement against payments and clearing ledger (finance.payment.record)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, period_start, period_end, statement_lines]
              properties:
                provider: { type: string, enum: [mpesa, card, bank, manual] }
                period_start: { type: string, format: date }
                period_end: { type: string, format: date }
                currency: { type: string, minLength: 3, maxLength: 3 }
                notes: { type: string, maxLength: 500 }
                statement_lines:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [provider_reference, amount]
                    properties:
                      provider_reference: { type: string, maxLength: 80 }
                      amount: { type: number, minimum: 0 }
      responses:
        '201': { description: Reconciliation completed with balanced/variance status and item results }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/finance/reconciliations/{reconciliation}:
    get:
