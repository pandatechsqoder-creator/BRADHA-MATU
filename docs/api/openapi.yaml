  /public/web-vitals:
    post:
      tags: [Public]
      summary: 'POST /public/web-vitals'
      description: Public Core Web Vitals beacon (LCP, CLS, INP, TTFB). Throttled per IP; no authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '202': { description: Sample recorded }
        '422': { description: Validation failed }
        '429': { description: Rate limited }
  /public/analytics/consent:
    post:
      tags: [Public]
      summary: 'POST /public/analytics/consent'
      description: Records or withdraws analytics consent for an anonymous browser session. Necessary storage stays enabled; marketing consent defaults to off. No PII is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, analytics]
              properties:
                session_id: { type: string, minLength: 8, maxLength: 64 }
                analytics: { type: boolean }
                marketing: { type: boolean }
                policy_version: { type: string, maxLength: 32 }
      responses:
        '200': { description: Preference stored }
        '422': { description: Validation failed }
        '429': { description: Rate limited }
  /public/analytics/events:
    post:
      tags: [Public]
      summary: 'POST /public/analytics/events'
      description: Ingests consented analytics events (page views and click events). Rejected with CONSENT_REQUIRED when the session has not granted analytics consent. Direct PII fields are stripped; IP addresses are stored only as a salted hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, events]
              properties:
                session_id: { type: string, minLength: 8, maxLength: 64 }
                events:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, enum: [page_view, cta_click, phone_click, whatsapp_click, form_start, download_start] }
                      url: { type: string }
                      path: { type: string }
                      referrer: { type: string }
                      device: { type: string, enum: [mobile, tablet, desktop] }
                      utm: { type: object }
                      payload: { type: object }
                      occurred_at: { type: string, format: date-time }
      responses:
        '202': { description: Events stored }
        '422': { description: Validation failed or CONSENT_REQUIRED }
        '429': { description: Rate limited }
