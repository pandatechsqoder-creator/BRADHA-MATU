openapi: 3.0.3
info:
  title: BRATHAMATU Stocktake API
  version: 1.0.0
  description: |
    Versioned REST API for the BRATHAMATU Stocktake platform.
    Baseline contract — Phase 1 (foundation + auth), Phase 2 (identity, tenancy, platform operations),
    Phase 3 (organisation structure, invitations, branch access scopes), Phase 4 (catalogue,
    queued imports, declarations, catalogue invoices and pricing policy), Phase 5 (inventory
    balances, movement ledger, cut-offs, frozen snapshots, batch/serial tracking and external
    movement imports), Phase 6 (stock-taking requests, quotes, deposits, amendments and
    cancellation), Phase 7 (sandbox payments, signed callbacks, allocation, double-entry ledger,
    reconciliation and refunds) and Phase 8 (workforce onboarding, verification, training,
    progression, assignment recommendation and offer lifecycle, worker earnings visibility),
    Phase 9 (SOP templates, check-in/out, attendance, live operations), Phase 10 (count sessions
    and entries), Phase 11 (offline package, sync batches, conflicts, heartbeats), Phase 12 (QA
    review, findings, verification, recount), Phase 13 (tenant review, reconciliation, disputes),
    Phase 14 (completion and payouts), Phase 15 (schedules and occurrences), Phase 16 (POS
    terminals, shifts, sales, receipts, cash reconciliation, back office, returns and transfers)
    and Phase 17 (POS stock-taking readiness, commission, authorise, decline and cancel),
    Phase 18 (external POS/ERP integrations, mappings, sync runs, webhooks and conflicts),
    Phase 19 (reporting and analytics, support tickets, notification centre) and Phase 20
    (security headers, rate limits, health diagnostics and retention controls).
    The generated baseline block near the end of `paths` covers every remaining registered route.
    Expanded each phase. All responses use the envelopes below. All timestamps UTC ISO-8601.
    Public identifiers are ULIDs. Money is decimal strings with ISO currency codes.
    Tenant-scoped requests may send X-Tenant-Id; the backend only honours it for valid memberships.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Service health (database + cache probes)
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Health' }
        '503':
          description: Degraded (one or more checks failed)
  /public/domains/suggestions:
    get:
      summary: Get available business-based tenant subdomain suggestions
      security: []
      parameters:
        - in: query
          name: business_name
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - in: query
          name: location
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { description: Ranked available tenant slugs and the configured base domain }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /public/domains/check:
    post:
      summary: Atomically reserve a selected tenant subdomain
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_name, slug]
              properties:
                business_name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, pattern: '^[a-z0-9]{2,63}$' }
                owner_email: { type: string, format: email }
                registration_attempt_uuid: { type: string, maxLength: 26 }
      responses:
        '200': { description: Domain reservation and expiry }
        '409': { description: Requested slug unavailable; includes refreshed suggestions }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /public/invitations/{token}:
    get:
      summary: Preview a single-use user invitation
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Invitation recipient, tenant, role, status and expiry }
        '404': { description: Invitation not found }
  /public/invitations/{token}/activate:
    post:
      summary: Activate an invited user and set their initial password
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password, password_confirmation]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200': { description: Invitation accepted and account activated }
        '404': { description: Invitation not found }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /public/registration:
    post:
      summary: Start tenant registration and reserve the explicitly selected slug
      security: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_name, owner_name, owner_email, slug, password, password_confirmation]
              properties:
                business_name: { type: string, minLength: 2, maxLength: 120 }
                display_name: { type: string, maxLength: 120 }
                industry: { type: string, maxLength: 100 }
                country: { type: string, minLength: 2, maxLength: 2 }
                county: { type: string, maxLength: 100 }
                owner_name: { type: string, minLength: 2, maxLength: 120 }
                owner_email: { type: string, format: email }
                owner_phone: { type: string, maxLength: 30 }
                slug: { type: string, pattern: '^[a-z0-9]{2,63}$' }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '201': { description: Verification started; response does not contain a verification code }
        '409': { description: Slug unavailable; includes refreshed suggestions }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /public/registration/verify:
    post:
      summary: Verify registration email and provision tenant and owner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_uuid, code]
              properties:
                attempt_uuid: { type: string, minLength: 26, maxLength: 26 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Verification succeeded; tenant and owner were created }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /public/registration/resend-code:
    post:
      summary: Resend a pending registration verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_uuid]
              properties:
                attempt_uuid: { type: string, minLength: 26, maxLength: 26 }
      responses:
        '200': { description: Code queued; response does not contain the code }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/forgot-password:
    post:
      summary: Send a password-reset link without disclosing account existence
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Reset request processed }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      summary: Complete a password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200': { description: Password reset completed }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/change-initial-password:
    post:
      summary: Set a new password for an authenticated account requiring initial setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200': { description: Initial password changed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants/{tenant}/invitations/{invitation}/resend:
    post:
      summary: Resend a tenant user invitation
      parameters:
        - in: path
          name: tenant
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
        - in: path
          name: invitation
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
      responses:
        '200': { description: Invitation queued for resend }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/domains:
    get:
      summary: List tenant domain allocations
      responses:
        '200': { description: Paginated tenant domains }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/domains/reservations:
    get:
      summary: List domain reservations
      responses:
        '200': { description: Paginated reservations and statuses }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/domains/settings:
    post:
      summary: Update tenant domain naming and reservation settings
      responses:
        '200': { description: Updated settings }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/domains/allocate:
    post:
      summary: Manually allocate a tenant subdomain
      responses:
        '200': { description: Allocated tenant slug and subdomain }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/domains/block:
    post:
      summary: Block a tenant subdomain slug
      responses:
        '200': { description: Slug blocked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/email/settings:
    get:
      summary: Get masked transactional email settings
      responses:
        '200': { description: Provider settings without secrets }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Save transactional email provider settings
      responses:
        '200': { description: Updated provider settings without secrets }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/email/test:
    post:
      summary: Send an email provider diagnostic message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient: { type: string, format: email }
      responses:
        '200': { description: Test email submitted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /platform/email/logs:
    get:
      summary: List transactional email delivery logs
      responses:
        '200': { description: Paginated delivery logs }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/email/logs/{log}/retry:
    post:
      summary: Queue a retry for an email delivery log
      parameters:
        - in: path
          name: log
          required: true
          schema: { type: string }
      responses:
        '200': { description: Email retry queued }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Delivery log not found }
  /auth/register:
    post:
      summary: Register a user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Account created; bearer token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthPayload' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Authenticated; bearer token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthPayload' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      summary: Revoke the current access token
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          logged_out: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me:
    get:
      summary: Current authenticated user
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /dashboard:
    get:
      summary: Role-aware workspace summary (platform, tenant, workforce or onboarding)
      responses:
        '200':
          description: Workspace, roles, tenant and readiness flags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/email/verification-notification:
    post:
      summary: Send an email verification code (test mode returns test_code)
      responses:
        '200':
          description: Code issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sent: { type: boolean }
                          test_code: { type: string, nullable: true }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/verify-email:
    post:
      summary: Confirm an email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants:
    get:
      summary: List tenants the caller belongs to (all tenants for platform admins)
      responses:
        '200':
          description: Tenant list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TenantSummary' }
    post:
      summary: Create an organisation (caller becomes Business Owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantInput' }
      responses:
        '201':
          description: Organisation created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants/{tenant}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Show a tenant (member or platform admin)
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a tenant (requires tenant.update)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantInput' }
      responses:
        '200':
          description: Tenant updated (audited)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/onboarding:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get the tenant setup checklist and persisted progress
      responses:
        '200':
          description: Setup steps, completion percentage, and recommended next step
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [steps, completion_percent, current_step, recommended_step, finished_at]
                        properties:
                          steps:
                            type: array
                            items:
                              type: object
                              required: [id, title, required, href, status]
                              properties:
                                id: { type: string }
                                title: { type: string }
                                required: { type: boolean }
                                href: { type: string }
                                status: { type: string, enum: [pending, completed, skipped] }
                          completion_percent: { type: integer, minimum: 0, maximum: 100 }
                          current_step: { type: string }
                          recommended_step:
                            type: object
                            nullable: true
                          finished_at: { type: string, format: date-time, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/onboarding/{step}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: step, in: path, required: true, schema: { type: string } }
    patch:
      summary: Save onboarding progress, skip/resume an optional step, or finish setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [skip, resume, continue, finish] }
      responses:
        '200': { description: Persisted onboarding progress }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants/{tenant}/members:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List tenant members with per-tenant roles
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/overview:
    get:
      summary: Platform operations overview counters
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlatformOverview' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/tenants:
    get:
      summary: Platform tenant directory (search, status, pagination)
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, pending, suspended] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Tenant page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TenantSummary' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/audit-logs:
    get:
      summary: Platform audit trail (action and tenant filters)
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: tenant
          in: query
          description: Tenant ULID
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLog' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/members/{user}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: user, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update a member's tenant roles and branch scopes
      description: Requires tenant.users.manage. Owners cannot remove their own Business Owner role; the last owner cannot be demoted. Sending an empty branch_ids array removes all restrictions (all branches).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items: { type: string }
                branch_ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Member' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Remove a member from the organisation
      description: Requires tenant.users.manage. Members cannot remove themselves.
      responses:
        '200':
          description: Membership removed
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants/{tenant}/roles:
    get:
      summary: List assignable tenant-scope roles
      parameters:
        - { name: tenant, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
