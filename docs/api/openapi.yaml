  /tenants/{tenant}/invitations:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      summary: List invitations (tenant.users.manage)
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Invite a person by email with a role and optional branch scope
      description: Returns the raw single-use token and accept_url once; only the hash is stored. Requires tenant.users.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, description: Tenant role slug }
                branch_id: { type: string, nullable: true, description: Branch ULID }
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Invitation'
                          - type: object
                            properties:
                              token: { type: string }
                              accept_url: { type: string }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/invitations/{invitation}/revoke:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: invitation, in: path, required: true, schema: { type: string } }
    post:
      summary: Revoke a pending invitation
      responses:
        '200':
          description: Invitation revoked
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /invitations/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      summary: Preview an invitation by token (signed-in users)
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invitations/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      summary: Accept an invitation (email must match the signed-in user)
      responses:
        '200':
          description: Membership, role and branch scope granted; returns the tenant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /tenants/{tenant}/catalogue:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      summary: Catalogue summary (current version, counts, declarations, invoice, readiness)
      responses:
        '200':
          description: Catalogue summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/catalogues/{catalogue}/versions:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: catalogue, in: path, required: true, schema: { type: string } }
    get:
      summary: List catalogue versions (newest first)
      responses:
        '200': { description: Versions }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/catalogues/{catalogue}/declarations:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: catalogue, in: path, required: true, schema: { type: string } }
    get:
      summary: List declarations for a catalogue
      responses:
        '200': { description: Declarations }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Declare the current catalogue version accurate and issue the fee invoice (catalogue.confirm)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declaration_text, confirm_accuracy]
              properties:
                declaration_text: { type: string, minLength: 20 }
                exceptions: { type: string, nullable: true }
                declaration_version: { type: string, example: '1.0' }
                confirm_accuracy: { type: boolean }
      responses:
        '201':
          description: Declaration recorded and invoice issued (or returned if already issued for the version)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: object }
        '422':
          description: Validation failed or the version is already declared (ALREADY_DECLARED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/catalogue/imports:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      summary: List catalogue imports
      responses:
        '200': { description: Imports }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Upload a CSV/XLSX catalogue import (queued; catalogue.import)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                partial_policy:
                  type: string
                  enum: [partial, all_or_nothing]
      responses:
        '202':
          description: Import queued for processing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: object }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/catalogue/imports/{import}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: import, in: path, required: true, schema: { type: string } }
    get:
      summary: Import detail with mapping, counts and preview rows
      responses:
        '200': { description: Import detail }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/catalogue/imports/{import}/mapping:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: import, in: path, required: true, schema: { type: string } }
    patch:
      summary: Save column mapping and revalidate rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mapping]
              properties:
                mapping:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200': { description: Mapping saved and rows revalidated }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/catalogue/imports/{import}/commit:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: import, in: path, required: true, schema: { type: string } }
    post:
      summary: Commit a ready import and publish a new catalogue version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duplicate_strategy:
                  type: string
                  enum: [skip, update]
                  default: skip
      responses:
        '201': { description: Import committed; catalogue version published }
        '422':
          description: Import not ready (errors with all_or_nothing, or already committed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/catalogue/imports/{import}/errors:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: import, in: path, required: true, schema: { type: string } }
    get:
      summary: Download the row-error report as CSV
      responses:
        '200':
          description: CSV of error and duplicate rows
          content:
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/products:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
    get:
      summary: List products with optional search, status and category filters
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, discontinued] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Paginated products }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a product with its primary variant and barcode (catalogue.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sku]
              properties:
                name: { type: string }
                sku: { type: string }
                variant_name: { type: string, nullable: true }
                barcode: { type: string, nullable: true }
                barcode_type: { type: string, nullable: true }
                brand: { type: string, nullable: true }
                category: { type: string, nullable: true }
                category_id: { type: string, nullable: true }
                description: { type: string, nullable: true }
                base_unit: { type: string, nullable: true }
                packaging_unit: { type: string, nullable: true }
                packaging_factor: { type: number, nullable: true }
                tracking_mode: { type: string, enum: [quantity, batch, serial, expiry, combination] }
                status: { type: string, enum: [active, inactive, discontinued] }
                supplier_ref: { type: string, nullable: true }
                cost_price: { type: number, nullable: true }
                attributes: { type: object, nullable: true }
      responses:
        '201': { description: Product created; catalogue version published }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenant}/products/{product}:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: product, in: path, required: true, schema: { type: string } }
    get:
      summary: Product detail (variants, barcodes, units; cost only with pricing permission)
      responses:
        '200': { description: Product }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a product (catalogue.update); publishes a new catalogue version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                sku: { type: string }
                variant_name: { type: string, nullable: true }
                brand: { type: string, nullable: true }
                category: { type: string, nullable: true }
                description: { type: string, nullable: true }
                base_unit: { type: string, nullable: true }
                packaging_unit: { type: string, nullable: true }
                packaging_factor: { type: number, nullable: true }
                tracking_mode: { type: string }
                status: { type: string, enum: [active, inactive, discontinued] }
                supplier_ref: { type: string, nullable: true }
                cost_price: { type: number, nullable: true }
                attributes: { type: object, nullable: true }
      responses:
        '200': { description: Product updated (version_created indicates a publish) }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Discontinue a product (history preserved; catalogue.update)
      responses:
        '200': { description: Product discontinued }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenant}/products/{product}/barcodes:
    parameters:
      - { name: tenant, in: path, required: true, schema: { type: string } }
      - { name: product, in: path, required: true, schema: { type: string } }
